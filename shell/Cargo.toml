[package]
name = "quarz_shell"
version = "0.2.0"
edition = "2024"
description = "Windows 11 context menu entries for Quarz"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
